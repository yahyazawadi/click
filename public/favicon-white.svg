<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Pure White Atmosphere Radial Gradient -->
    <radialGradient id="pureWhiteAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Pure White Node Radial Gradient -->
    <radialGradient id="pureWhiteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Ambient Planet Core Glow -->
    <circle cx="0" cy="0" r="256" fill="url(#pureWhiteAtmosphere)" />

    <!-- ========================================== -->
    <!-- 1. BACK ARCS (PASSING BEHIND CENTRAL CORE) -->
    <!-- ========================================== -->

    <!-- Ring 2 (Outer Tilted Orbital Path - Back Arc) -->
    <g transform="rotate(35)">
      <path d="M -270 0 A 270 100 0 0 1 270 0" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="butt" opacity="0.6" />
    </g>

    <!-- Ring 1 (Inner Bright Orbital Path - Back Arc) -->
    <g transform="rotate(-15)">
      <path d="M -220 0 A 220 78 0 0 1 220 0" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="butt" opacity="0.75" />
    </g>

    <!-- ========================================== -->
    <!-- 2. CENTRAL CORE PLANET SPHERE (PURE WHITE) -->
    <!-- ========================================== -->
    <circle cx="0" cy="0" r="135" fill="#ffffff" opacity="0.9" />

    <!-- ========================================== -->
    <!-- 3. FRONT ARCS (PASSING IN FRONT OF CORE)   -->
    <!-- ========================================== -->

    <!-- Ring 1 (Inner Bright Orbital Path - Front Arc) -->
    <g transform="rotate(-15)">
      <path d="M 220 0 A 220 78 0 0 1 -220 0" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="butt" opacity="1.0" />
      <!-- Node on Ring 1 (Front Right) -->
      <circle cx="216" cy="0" r="40" fill="url(#pureWhiteGlow)" />
      <circle cx="216" cy="0" r="16" fill="#ffffff" />
    </g>

    <!-- Ring 2 (Outer Tilted Orbital Path - Front Arc) -->
    <g transform="rotate(35)">
      <path d="M 270 0 A 270 100 0 0 1 -270 0" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="butt" opacity="0.9" />
      
      <!-- Node 1: Top-Left Node on Ring 2 -->
      <circle cx="-270" cy="0" r="35" fill="url(#pureWhiteGlow)" />
      <circle cx="-270" cy="0" r="14" fill="#ffffff" />

      <!-- Node 2: Bottom-Right Node on Ring 2 -->
      <circle cx="270" cy="0" r="35" fill="url(#pureWhiteGlow)" />
      <circle cx="270" cy="0" r="14" fill="#ffffff" />
    </g>

    <!-- Center Core Emblem Crosshair Rings -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#000000" stroke-width="4" opacity="0.3" />
    <circle cx="0" cy="0" r="14" fill="#000000" opacity="0.3" />
  </g>
</svg>
