<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1d38" />
      <stop offset="100%" stop-color="#040b17" />
    </radialGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Soft Glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>

    <!-- Core Gradient -->
    <radialGradient id="coreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="40%" stop-color="#00bae3" />
      <stop offset="80%" stop-color="#003268" />
      <stop offset="100%" stop-color="#001430" />
    </radialGradient>

    <!-- Ring 1 Gradient (Cyan Glowing Arc) -->
    <linearGradient id="ring1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00bae3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#5dbae1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Ring 2 Gradient (Secondary Tilted Arc) -->
    <linearGradient id="ring2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5dbae1" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00bae3" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#003268" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Canvas with Rounded Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00bae3" stroke-opacity="0.25" stroke-width="6" />

  <!-- Outer Ambient Aura -->
  <circle cx="256" cy="256" r="140" fill="#00bae3" opacity="0.15" filter="url(#glow)" />

  <!-- Back Segment of Ring 2 (Behind Core) -->
  <g transform="translate(256, 256) rotate(-35) scale(1, 0.35)">
    <path d="M -190 0 A 190 190 0 0 1 190 0" fill="none" stroke="url(#ring2Grad)" stroke-width="12" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Back Segment of Ring 1 (Behind Core) -->
  <g transform="translate(256, 256) rotate(45) scale(1, 0.38)">
    <path d="M -165 0 A 165 165 0 0 1 165 0" fill="none" stroke="url(#ring1Grad)" stroke-width="14" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Central Planet Core -->
  <circle cx="256" cy="256" r="92" fill="url(#coreGrad)" filter="url(#glow)" />

  <!-- Core Specular / Highlight Facet -->
  <path d="M 210 190 Q 256 170 290 200 Q 245 225 210 190 Z" fill="#ffffff" opacity="0.35" />

  <!-- Front Segment of Ring 1 (In Front of Core) -->
  <g transform="translate(256, 256) rotate(45) scale(1, 0.38)">
    <path d="M 165 0 A 165 165 0 0 1 -165 0" fill="none" stroke="url(#ring1Grad)" stroke-width="14" stroke-linecap="round" filter="url(#glow)" />
    <!-- Orbiting Node Dot -->
    <circle cx="-135" cy="95" r="14" fill="#00f0ff" filter="url(#glow)" />
    <circle cx="-135" cy="95" r="7" fill="#ffffff" />
  </g>

  <!-- Front Segment of Ring 2 (In Front of Core) -->
  <g transform="translate(256, 256) rotate(-35) scale(1, 0.35)">
    <path d="M 190 0 A 190 190 0 0 1 -190 0" fill="none" stroke="url(#ring2Grad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />
    <!-- Secondary Orbiting Node Dot -->
    <circle cx="160" cy="-100" r="11" fill="#5dbae1" filter="url(#glow)" />
    <circle cx="160" cy="-100" r="5" fill="#ffffff" />
  </g>

  <!-- Center Energy Beacon -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" filter="url(#glow)" />
</svg>
