<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Core Flare for Light Mode (No Muddy Colors!) -->
    <radialGradient id="coreEnergyVibrant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0088cc" />
      <stop offset="90%" stop-color="#003366" />
      <stop offset="100%" stop-color="#00122e" />
    </radialGradient>

    <!-- Crisp Dark Outer Shadow Filter so Vibrant Cyan Pops on White Tabs -->
    <filter id="darkContrastRim" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#020817" flood-opacity="0.6" />
    </filter>

    <!-- Pure White Node Radial Glow -->
    <radialGradient id="nodeWhiteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0088cc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Dark Contrast Rim Base for White Backgrounds -->
    <circle cx="0" cy="0" r="140" fill="#00122e" opacity="0.15" filter="url(#darkContrastRim)" />

    <!-- ========================================== -->
    <!-- 1. BACK ARCS (PASSING BEHIND CENTRAL CORE) -->
    <!-- ========================================== -->

    <!-- Ring 2 (Outer Tilted Orbital Path - Back Arc) -->
    <g transform="rotate(35)">
      <path d="M -270 0 A 270 100 0 0 1 270 0" fill="none" stroke="#0077b6" stroke-width="14" stroke-linecap="butt" opacity="0.9" />
    </g>

    <!-- Ring 1 (Inner Bright Orbital Path - Back Arc) -->
    <g transform="rotate(-15)">
      <path d="M -220 0 A 220 78 0 0 1 220 0" fill="none" stroke="#00b4d8" stroke-width="16" stroke-linecap="butt" opacity="0.95" />
    </g>

    <!-- ========================================== -->
    <!-- 2. CENTRAL CORE PLANET SPHERE              -->
    <!-- ========================================== -->
    <circle cx="0" cy="0" r="135" fill="url(#coreEnergyVibrant)" filter="url(#darkContrastRim)" />

    <!-- ========================================== -->
    <!-- 3. FRONT ARCS (PASSING IN FRONT OF CORE)   -->
    <!-- ========================================== -->

    <!-- Ring 1 (Inner Bright Orbital Path - Front Arc) -->
    <g transform="rotate(-15)">
      <path d="M 220 0 A 220 78 0 0 1 -220 0" fill="none" stroke="#00b4d8" stroke-width="16" stroke-linecap="butt" opacity="0.95" />
      <!-- Node on Ring 1 (Front Right) -->
      <circle cx="216" cy="0" r="40" fill="url(#nodeWhiteGlow)" />
      <circle cx="216" cy="0" r="16" fill="#00f0ff" />
      <circle cx="216" cy="0" r="7" fill="#ffffff" />
    </g>

    <!-- Ring 2 (Outer Tilted Orbital Path - Front Arc) -->
    <g transform="rotate(35)">
      <path d="M 270 0 A 270 100 0 0 1 -270 0" fill="none" stroke="#0077b6" stroke-width="14" stroke-linecap="butt" opacity="0.9" />
      
      <!-- Node 1: Top-Left Node on Ring 2 -->
      <circle cx="-270" cy="0" r="35" fill="url(#nodeWhiteGlow)" />
      <circle cx="-270" cy="0" r="14" fill="#0077b6" />
      <circle cx="-270" cy="0" r="6" fill="#ffffff" />

      <!-- Node 2: Bottom-Right Node on Ring 2 -->
      <circle cx="270" cy="0" r="35" fill="url(#nodeWhiteGlow)" />
      <circle cx="270" cy="0" r="14" fill="#0096c7" />
      <circle cx="270" cy="0" r="6" fill="#ffffff" />
    </g>

    <!-- Center Core Emblem Crosshair Rings -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <circle cx="0" cy="0" r="26" fill="url(#nodeWhiteGlow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
  </g>
</svg>
