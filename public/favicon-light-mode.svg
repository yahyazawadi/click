<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Core Flare for Light Mode -->
    <radialGradient id="coreEnergyVibrant" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0088cc" />
      <stop offset="90%" stop-color="#003366" />
      <stop offset="100%" stop-color="#00122e" />
    </radialGradient>

    <!-- Crisp Dark Outer Shadow Filter -->
    <filter id="darkContrastRim" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#020817" flood-opacity="0.6" />
    </filter>

    <!-- Pure White Node Radial Glow -->
    <radialGradient id="nodeWhiteGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#0088cc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0088cc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Dark Contrast Rim Base for White Backgrounds -->
    <circle cx="0" cy="0" r="140" fill="#00122e" opacity="0.15" filter="url(#darkContrastRim)">
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- ========================================== -->
    <!-- 1. BACK ARCS (PASSING BEHIND CENTRAL CORE) -->
    <!-- ========================================== -->

    <!-- Ring 2 (Outer Tilted Orbital Path - Back Arc) -->
    <g transform="rotate(35)">
      <path d="M -270 0 A 270 100 0 0 1 270 0" fill="none" stroke="#0077b6" stroke-width="14" stroke-linecap="butt" opacity="0.9" />
    </g>

    <!-- Ring 1 (Inner Bright Orbital Path - Back Arc) -->
    <g transform="rotate(-15)">
      <path d="M -220 0 A 220 78 0 0 1 220 0" fill="none" stroke="#00b4d8" stroke-width="16" stroke-linecap="butt" opacity="0.95" />
    </g>

    <!-- ========================================== -->
    <!-- 2. CENTRAL CORE PLANET SPHERE (VISIBLY ROTATING) -->
    <!-- ========================================== -->
    <g filter="url(#darkContrastRim)">
      <!-- Core Energy Sphere Base -->
      <circle cx="0" cy="0" r="135" fill="url(#coreEnergyVibrant)" />

      <!-- Surface Details & Energy Filaments (Stationary Core) -->
      <g>
        
        <!-- Curved Energy Swirl Filaments -->
        <path d="M -100 -35 Q -35 -90 35 -100 Q 90 -35 100 35 Q 35 90 -35 100 Q -90 35 -100 -35 Z" fill="none" stroke="#00f0ff" stroke-width="7" opacity="0.75" stroke-dasharray="25 15 35 10" />
        <path d="M -80 25 Q 0 -80 80 -25 Q 0 80 -80 25 Z" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.85" stroke-dasharray="15 15" />
        
        <!-- 4 Core Energy Surface Orbs -->
        <circle cx="0" cy="-80" r="13" fill="#ffffff" />
        <circle cx="80" cy="0" r="11" fill="#00f0ff" />
        <circle cx="0" cy="80" r="13" fill="#ffffff" />
        <circle cx="-80" cy="0" r="11" fill="#00f0ff" />

        <!-- Rotating Core Emblem Crosshair Star -->
        <circle cx="0" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.95" />
        <polygon points="0,-32 9,-9 32,0 9,9 0,32 -9,9 -32,0 -9,-9" fill="#00f0ff" opacity="0.9" />
        <circle cx="0" cy="0" r="11" fill="#ffffff" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. FRONT ARCS & ANIMATED MOVING PLANETS    -->
    <!-- ========================================== -->

    <!-- Ring 1 (Inner Bright Orbital Path - Front Arc & Moving Planet) -->
    <g transform="rotate(-15)">
      <path d="M 220 0 A 220 78 0 0 1 -220 0" fill="none" stroke="#00b4d8" stroke-width="16" stroke-linecap="butt" opacity="0.95" />
      
      <!-- Planet Node 1 moving slowly along Ring 1 -->
      <g>
        <animateMotion dur="14s" repeatCount="indefinite" path="M 220 0 A 220 78 0 1 1 -220 0 A 220 78 0 1 1 220 0" />
        <circle cx="0" cy="0" r="40" fill="url(#nodeWhiteGlow)" />
        <circle cx="0" cy="0" r="16" fill="#00f0ff" />
        <circle cx="0" cy="0" r="7" fill="#ffffff" />
      </g>
    </g>

    <!-- Ring 2 (Outer Tilted Orbital Path - Front Arc & Moving Planets) -->
    <g transform="rotate(35)">
      <path d="M 270 0 A 270 100 0 0 1 -270 0" fill="none" stroke="#0077b6" stroke-width="14" stroke-linecap="butt" opacity="0.9" />
      
      <!-- Planet Node 1 moving slowly on Ring 2 -->
      <g>
        <animateMotion dur="20s" repeatCount="indefinite" path="M -270 0 A 270 100 0 1 1 270 0 A 270 100 0 1 1 -270 0" />
        <circle cx="0" cy="0" r="35" fill="url(#nodeWhiteGlow)" />
        <circle cx="0" cy="0" r="14" fill="#0077b6" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" />
      </g>

      <!-- Planet Node 2 moving slowly on Ring 2 -->
      <g>
        <animateMotion dur="20s" repeatCount="indefinite" path="M 270 0 A 270 100 0 1 1 -270 0 A 270 100 0 1 1 270 0" />
        <circle cx="0" cy="0" r="35" fill="url(#nodeWhiteGlow)" />
        <circle cx="0" cy="0" r="14" fill="#0096c7" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" />
      </g>
    </g>
  </g>
</svg>
