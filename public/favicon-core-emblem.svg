<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071124" />
      <stop offset="50%" stop-color="#050e1f" />
      <stop offset="100%" stop-color="#020610" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="cyanGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Planet Core Spherical Gradient -->
    <radialGradient id="planetShade" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#00bae3" />
      <stop offset="75%" stop-color="#003268" />
      <stop offset="100%" stop-color="#001026" />
    </radialGradient>

    <!-- Ring Metallic Cyan Gradient -->
    <linearGradient id="metalCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#00bae3" />
      <stop offset="100%" stop-color="#003268" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Tech Shield Background -->
  <polygon points="256,16 464,136 464,376 256,496 48,376 48,136" fill="url(#bgGrad)" stroke="#00bae3" stroke-width="8" stroke-linejoin="round" />

  <!-- Inner Hex Ring -->
  <polygon points="256,42 440,148 440,364 256,470 72,364 72,148" fill="none" stroke="#5dbae1" stroke-width="2" opacity="0.4" stroke-dasharray="16 12" />

  <!-- Core Atmosphere Ambient Glow -->
  <circle cx="256" cy="256" r="135" fill="#00bae3" opacity="0.22" filter="url(#cyanGlow)" />

  <!-- Tilted Saturnian Orbital Ring (Back Half) -->
  <g transform="translate(256, 256) rotate(-22)">
    <ellipse cx="0" cy="0" rx="195" ry="55" fill="none" stroke="url(#metalCyan)" stroke-width="12" opacity="0.3" stroke-dasharray="0 250 250 0" />
  </g>

  <!-- Core Planet Sphere -->
  <circle cx="256" cy="256" r="105" fill="url(#planetShade)" filter="url(#cyanGlow)" />

  <!-- Geometric Tech Meridian Lines on Planet -->
  <g fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.5" transform="translate(256,256)">
    <ellipse cx="0" cy="0" rx="105" ry="40" />
    <ellipse cx="0" cy="0" rx="50" ry="105" />
    <line x1="-105" y1="0" x2="105" y2="0" />
    <line x1="0" y1="-105" x2="0" y2="105" />
  </g>

  <!-- Tilted Saturnian Orbital Ring (Front Half) -->
  <g transform="translate(256, 256) rotate(-22)">
    <path d="M -195 0 A 195 55 0 0 0 195 0" fill="none" stroke="url(#metalCyan)" stroke-width="16" stroke-linecap="round" filter="url(#cyanGlow)" />
    <!-- Bright Ring Edge Nodes -->
    <circle cx="-195" cy="0" r="10" fill="#00f0ff" filter="url(#cyanGlow)" />
    <circle cx="-195" cy="0" r="5" fill="#ffffff" />
  </g>

  <!-- Glowing Core Nucleus -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#cyanGlow)" />
</svg>
