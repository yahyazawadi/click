<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1a33" />
      <stop offset="100%" stop-color="#030814" />
    </radialGradient>

    <!-- Glowing Cyan Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Facet Shader Gradients -->
    <linearGradient id="facet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bae3" />
      <stop offset="100%" stop-color="#003268" />
    </linearGradient>
    <linearGradient id="facet2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5dbae1" />
      <stop offset="100%" stop-color="#001a3d" />
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#00bae3" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Core Planet Inner Aura -->
  <circle cx="256" cy="256" r="130" fill="#00bae3" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Geodesic Outer Lattice Frame & Nodes -->
  <g transform="translate(256, 256)">
    <!-- Outer Shield Ring -->
    <circle cx="0" cy="0" r="165" fill="none" stroke="#00bae3" stroke-width="3" stroke-dasharray="12 16" opacity="0.6" />
    
    <!-- Outer Tilted Ring -->
    <ellipse cx="0" cy="0" rx="200" ry="70" fill="none" stroke="url(#facetHighlight)" stroke-width="8" transform="rotate(-28)" filter="url(#neonGlow)" />

    <!-- 3D Polyhedron Core Facets (Icosahedron Style) -->
    <g filter="url(#neonGlow)">
      <!-- Top Center Face -->
      <polygon points="0,-105 -75,-40 0,-10" fill="url(#facetHighlight)" opacity="0.9" />
      <polygon points="0,-105 0,-10 75,-40" fill="url(#facet1)" opacity="0.8" />

      <!-- Upper Side Faces -->
      <polygon points="-75,-40 -105,35 0,-10" fill="url(#facet2)" opacity="0.95" />
      <polygon points="75,-40 0,-10 105,35" fill="url(#facet1)" opacity="0.75" />

      <!-- Lower Center Faces -->
      <polygon points="-105,35 0,105 0,-10" fill="url(#facet1)" opacity="0.85" />
      <polygon points="105,35 0,-10 0,105" fill="url(#facet2)" opacity="0.9" />

      <!-- Bottom Side Triangles -->
      <polygon points="-105,35 -60,95 0,105" fill="url(#facet2)" opacity="0.7" />
      <polygon points="105,35 0,105 60,95" fill="url(#facetHighlight)" opacity="0.85" />
    </g>

    <!-- Geodesic Wireframe Overlay Grid Lines -->
    <g fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.85">
      <line x1="0" y1="-105" x2="-75" y2="-40" />
      <line x1="-75" y1="-40" x2="0" y2="-10" />
      <line x1="0" y1="-10" x2="0" y2="-105" />
      <line x1="0" y1="-105" x2="75" y2="-40" />
      <line x1="75" y1="-40" x2="0" y2="-10" />

      <line x1="-75" y1="-40" x2="-105" y2="35" />
      <line x1="-105" y1="35" x2="0" y2="-10" />
      <line x1="75" y1="-40" x2="105" y2="35" />
      <line x1="105" y1="35" x2="0" y2="-10" />

      <line x1="-105" y1="35" x2="0" y2="105" />
      <line x1="105" y1="35" x2="0" y2="105" />
      <line x1="0" y1="-10" x2="0" y2="105" />
    </g>

    <!-- Lattice Vertices / Glowing Nodes -->
    <circle cx="0" cy="-105" r="7" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="-75" cy="-40" r="6" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="75" cy="-40" r="6" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="0" cy="-10" r="8" fill="#ffffff" filter="url(#neonGlow)" />
    <circle cx="-105" cy="35" r="6" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="105" cy="35" r="6" fill="#00f0ff" filter="url(#neonGlow)" />
    <circle cx="0" cy="105" r="7" fill="#ffffff" filter="url(#neonGlow)" />
  </g>
</svg>
